<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found | Jeff Kabera</title>
    <meta name="description" content="The page you are looking for could not be found." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 24px;
      }
      .wrap { max-width: 460px; }
      .code { font-size: 96px; font-weight: 800; line-height: 1;
        background: linear-gradient(to right, #fb923c, #ea580c);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent; }
      h1 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
      p { color: #a3a3a3; font-size: 15px; margin-bottom: 28px; }
      a {
        display: inline-block;
        background: linear-gradient(to right, #f97316, #c2410c);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 13px 30px;
        border-radius: 999px;
        transition: transform 0.2s;
      }
      a:hover { transform: scale(1.05); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you are looking for doesn&apos;t exist or has been moved.</p>
      <a href="/">Back to Home</a>
    </div>
  </body>
</html>
